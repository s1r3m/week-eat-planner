name: BE Checks
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  linters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install dependencies
        run: |
          make install

      - name: Analysing the code with linters
        run: |
          make be_lint

  be_unittests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install dependencies
        run: |
          make install

      - name: Run the env
        run: |
          make test_env

      - name: Run tests
        run: |
          make be_test

      - name: Show Docker logs on failure
        if: failure()
        run: make logs

      - name: Stop the DB and clean up
        # This step will run even if the tests fail, ensuring Docker containers are stopped.
        if: always()
        run: make stop
