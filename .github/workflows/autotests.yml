name: autotests.yml
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: allure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lintes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install dependencies
        run: make -C qa install

      - name: Run linters
        run: make -C qa lint

  autotests:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true

      # Allure 2 CLI requires Java.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: npm install --global allure-commandline@2.34.1

      # Retrieve the previously published report.
      - name: Fetch previous Allure report
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages

            git worktree add \
              --detach \
              "$RUNNER_TEMP/gh-pages" \
              refs/remotes/origin/gh-pages
          else
            echo "No previous report. Starting without history."
            mkdir -p "$RUNNER_TEMP/gh-pages"
          fi

      - name: Install dependencies
        run: make -C qa install

      - name: Run the app
        run: make -C qa start

      - name: Run tests
        id: tests
        continue-on-error: true
        run: make -C qa test

      - name: Show Docker logs on failure
        if: failure() || steps.tests.outcome == 'failure'
        run: cd qa/docker && docker compose logs

      - name: Stop the app and clean up
        # This step will run even if the tests fail, ensuring Docker containers are stopped.
        if: always()
        run: make -C qa stop

      # Restore history AFTER pytest has cleaned and generated results.
      - name: Generate Allure report
        id: report
        if: >
          !cancelled() &&
          (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        run: |
          mkdir -p qa/allure-results

          if [ -d "$RUNNER_TEMP/gh-pages/history" ]; then
            echo "Restoring previous Allure history..."

            mkdir -p qa/allure-results/history

            cp -a \
              "$RUNNER_TEMP/gh-pages/history/." \
              qa/allure-results/history/
          fi

          if ! find qa/allure-results -type f -print -quit | grep -q .; then
            echo "No Allure results found. Skipping report generation."
            echo "report_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          allure generate \
            qa/allure-results \
            --clean \
            -o qa/allure-report

          echo "report_available=true" >> "$GITHUB_OUTPUT"

      # Keep raw results for debugging.
      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: qa/allure-results/
          if-no-files-found: ignore
          retention-days: 14

      # Keep HTML report available even for PRs.
      - name: Upload HTML report
        if: always() && steps.report.outputs.report_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: qa/allure-report/
          retention-days: 14

      # Publish only from develop.
      - name: Publish Allure report to GitHub Pages
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/develop' &&
          steps.report.outputs.report_available == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./qa/allure-report

      # Restore the original test exit status.
      - name: Fail workflow if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
