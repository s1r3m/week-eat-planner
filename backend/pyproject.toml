[build-system]
# Specifies the build tools needed. hatchling is a modern, fast backend.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "week_eat_planner"
version = "0.2.0"
description = "My Menu Planner app to get a shopping list for a week in a click."
license = {text = "MIT"}
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Filipp Aleksandrov", email = "s1r3m@yahoo.com" },
]

classifiers = [                     # Standard classifiers for PyPI
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

dependencies = [
    "asyncpg==0.32.0",
    "fastapi[standard]==0.143.*",
    "uvicorn[standard]==0.54.*",
    "pydantic==2.14.*",
    "pydantic-settings==2.15.*",
    "alembic==1.20.*",
    "sqlalchemy[asyncio]==2.1.*",
    "psycopg[binary]==3.3.*",
    "httpx==0.28.*",
    "loguru==0.7.*",
    "python-jose[cryptography]==3.5.*",
    "gevent==26.9.*",
    "uuid-utils==1.*",
    "boto3==1.43.*",
    "python-multipart==0.0.32",
    "bcrypt>=5.0.0",
    "argon2-cffi>=25.1.0",
]

[project.urls]
Homepage = "https://github.com/s1r3m/week-eat-planner"
Repository = "https://github.com/s1r3m/week-eat-planner"

[project.optional-dependencies]
dev = [
    "pytest==9.1.*",
    "pytest-asyncio==1.4.*",
    "pytest-cov==7.1.*",
    "pytest-mock==3.16.*",
    "ruff==0.17.*",
    "mypy==2.4.*",
    "types-ujson==5.10.0.20250822",
    "freezegun==1.5.*",
]

# --- ENTRY POINT DEFINITION ---
[project.scripts]
# This creates an executable command when the package is installed.
# Format: command_name = "path.to.module:function_or_object"
# We need a way to *run* the uvicorn server.
# Let's point it to a function that starts uvicorn.
week-eat-planner-server = "week_eat_planner.main:start_app"

[tool.ruff]
exclude = [
    ".venv*",
    "migrations",
]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ['week_eat_planner']
case-sensitive = true
combine-as-imports = true
order-by-type = false

[tool.ruff.lint]
select = [
    'D',   # pydocstyle: Google-style application docstrings
    'E',   # pycodestyle: PEP8 style & formatting rules
    'W',   # pycodestyle: warnings
    'F',   # pyflakes: syntax and logical errors
    'I',   # isort: import sorting
    'B',   # flake8-bugbear: common bug patterns
    'UP',  # pyupgrade: modernize Python code
    'N',   # pep8-naming: naming conventions
    'PT',  # flake8-pytest-style: pytest-specific rules
    'SIM', # flake8-simplify: simplify expressions & control flow
    'PL',  # pylint (subset): useful pylint-like checks
]
ignore = [
    'PT011',
    'B017',
    'PLR0913',
    'PLR0917',
]

fixable = ['ALL']
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*/tests/**" = ["D"]
"settings.py" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short -vv --cache-clear"
xfail_strict = true

[tool.mypy]
python_version = "3.14"
plugins = "pydantic.mypy"

exclude = [
    '/test_.*',
    '/migrations/*',
]

ignore_missing_imports = true
show_column_numbers = true
show_absolute_path = true

allow_redefinition = true
no_implicit_reexport = true
strict_equality = true

disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true

warn_unused_ignores = true
warn_unused_configs = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true

no_implicit_optional = true

[tool.coverage.run]
source = ["week_eat_planner"]
branch = true
concurrency = ["gevent", "thread"]
omit = [
    "tests/*",  # Exclude all test files and directories
    # Omit files that are primarily configuration or startup logic
    "week_eat_planner/main.py",
    "week_eat_planner/config.py",
    "week_eat_planner/exceptions.py",
]

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = 'black'
line_length = 120
case_sensitive = true
combine_as_imports = true
order_by_type = false
known_first_party = ['week_eat_planner']
