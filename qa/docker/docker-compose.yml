services:
  nginx:
    image: nginx:latest
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
      - mailpit
    networks:
      default:
        aliases:
          - app.dev.local
  backend:
    build:
      context: ../../
      dockerfile: qa/docker/app/Dockerfile
    env_file:
      - .env.ci
    expose:
      - 8000
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "httpx  http://localhost:8000/ping | grep 200"]
      interval: 15s
      timeout: 5s
      retries: 5
  proxy:
    build:
      context: ../..
      dockerfile: qa/docker/proxy/Dockerfile
    env_file:
      - .env.ci
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      - db
      - backend
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    environment:
      - NUXT_PUBLIC_API_URL=http://app.dev.local/api
    expose:
      - 3000
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    command: bun run dev --port 3000 --host 0.0.0.0
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: wep
      POSTGRES_USER: wep
      POSTGRES_PASSWORD: wep
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:
  postgres_data:
