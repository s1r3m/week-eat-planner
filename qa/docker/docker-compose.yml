services:
  nginx:
    image: nginx:latest
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      default:
        aliases:
          - app.dev.local
  backend:
    build:
      context: ../../
      dockerfile: qa/docker/app/Dockerfile
    env_file:
      - .env.ci
    expose:
      - 8000
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "httpx  http://localhost:8000/ping | grep 200"]
      interval: 15s
      timeout: 5s
      retries: 5
  proxy:
    build:
      context: ../..
      dockerfile: qa/docker/proxy/Dockerfile
    env_file:
      - .env.ci
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      - db
      - backend
  frontend:
    build:
      context: ../..
      dockerfile: qa/docker/frontend/Dockerfile
    environment:
      - NUXT_API_URL=http://backend:8000
      - NUXT_PUBLIC_API_URL=/api
    ports:
      - "3001:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/login'); process.exit(response.ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: wep
      POSTGRES_USER: wep
      POSTGRES_PASSWORD: wep
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:
  postgres_data:
